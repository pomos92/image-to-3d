name: Probe HF 3D spaces
on:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/probe-spaces.yml", "mobile/android/app/src/main/java/com/pomos92/imageto3d/HunyuanClient.java"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements.txt
      - run: curl -s https://tencent-hunyuan3d-2.hf.space/config | python -c "import json,sys; c=json.load(sys.stdin); print('version', c.get('version'), 'api_prefix', c.get('api_prefix'))"
      - run: python tools/probe_rest.py tests/sample.png
        continue-on-error: true
      - name: Java client (same code as the Android app)
        run: |
          mkdir -p probe-out
          java mobile/android/app/src/main/java/com/pomos92/imageto3d/HunyuanClient.java tests/sample.png probe-out/hunyuan.glb
      - name: Publish probe output
        if: always()
        run: |
          cd probe-out 2>/dev/null || exit 0
          git init -q -b probe-output
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "probe ${GITHUB_SHA}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" probe-output
