name: Probe HF 3D spaces
on:
  push:
    branches: [main]
    paths: ["tools/probe_spaces.py", ".github/workflows/probe-spaces.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/probe_spaces.py tests/sample.png
