name: Probe HF 3D spaces
on:
  push:
    branches: [main]
    paths: ["tools/**", "img23d/cloud.py", ".github/workflows/probe-spaces.yml", "mobile/android/app/src/main/java/com/pomos92/imageto3d/TrellisClient.java"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements.txt requests
      - name: Python request log
        continue-on-error: true
        run: python tools/probe_rest.py tests/sample.png
      - name: Java client (same code as the Android app)
        continue-on-error: true
        run: |
          mkdir -p probe-out
          curl -sL -o json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          java -cp json.jar mobile/android/app/src/main/java/com/pomos92/imageto3d/TrellisClient.java tests/sample.png probe-out/trellis.glb
      - name: PC cloud engine (TRELLIS)
        continue-on-error: true
        run: python -c "from img23d import cloud; print(cloud.generate('tests/sample.png', 'TRELLIS'))"
      - name: Publish probe output
        if: always()
        run: |
          cd probe-out 2>/dev/null || exit 0
          git init -q -b probe-output
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "probe ${GITHUB_SHA}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" probe-output
