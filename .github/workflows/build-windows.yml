name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: pyinstaller --noconfirm image_to_3d.spec
      - name: Smoke test (offline engine)
        run: python cli.py tests/sample.png --engine basic --out smoke
      - name: Smoke test (exe starts)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ImageTo3D\ImageTo3D.exe -PassThru -WorkingDirectory dist\ImageTo3D
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7860; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "exe did not start web UI" }
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md dist\ImageTo3D\
          Compress-Archive -Path dist\ImageTo3D -DestinationPath ImageTo3D-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ImageTo3D-windows
          path: ImageTo3D-windows.zip
      - name: Publish build to windows-build branch (main only)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir out && cd out
          split -b 90m -d -a 2 ../ImageTo3D-windows.zip ImageTo3D-windows.zip.part
          sha256sum ../ImageTo3D-windows.zip | cut -d' ' -f1 > ImageTo3D-windows.zip.sha256
          echo "${GITHUB_SHA}" > COMMIT
          git init -q -b windows-build
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Windows build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" windows-build
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ImageTo3D-windows.zip
