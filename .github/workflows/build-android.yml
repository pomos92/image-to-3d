name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build web app
        working-directory: mobile/web
        run: |
          npm install --no-audit --no-fund
          npm run build
          mkdir -p ../android/app/src/main/assets/www
          cp -r dist/* ../android/app/src/main/assets/www/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        run: gradle -p mobile/android assembleRelease --no-daemon
      - name: Collect
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk ImageTo3D.apk
          ls -la ImageTo3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ImageTo3D-android
          path: ImageTo3D.apk
      - name: Publish APK to android-build branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir out && cp ImageTo3D.apk out/ && cd out
          sha256sum ImageTo3D.apk | cut -d' ' -f1 > ImageTo3D.apk.sha256
          echo "${GITHUB_SHA}" > COMMIT
          git init -q -b android-build
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Android build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" android-build
