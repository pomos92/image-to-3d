plugins {
    id "com.android.application"
}

android {
    namespace "com.pomos92.imageto3d"
    compileSdk 35

    defaultConfig {
        applicationId "com.pomos92.imageto3d"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 테스트용: 디버그 키로 서명해서 바로 설치 가능하게
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
