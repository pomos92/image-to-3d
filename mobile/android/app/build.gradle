plugins {
    id "com.android.application"
}

android {
    namespace "com.pomos92.imageto3d"
    compileSdk 35

    defaultConfig {
        applicationId "com.pomos92.imageto3d"
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName "1.1.4"
    }

    // 개인 테스트 배포용 고정 서명 키 (빌드마다 키가 바뀌면 업데이트 설치가 막히므로 저장소에 고정).
    // Play 스토어 배포용 키가 아니에요.
    signingConfigs {
        test {
            storeFile file("test-signing.jks")
            storePassword "imageto3d"
            keyAlias "imageto3d"
            keyPassword "imageto3d"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.test
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
