<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이미지 → 3D</title>
<style>
  :root { --bg:#ffffff; --fg:#1d2330; --muted:#6b7280; --line:#e5e7eb; --accent:#ea580c; --card:#f8f9fb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161b; --fg:#eef0f4; --muted:#9aa1ad; --line:#2b2f38; --card:#1c1f26; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 32px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  p.sub { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  #view { width: 100%; height: 52vh; min-height: 280px; border-radius: 14px; overflow: hidden; background:#f2f3f5; position: relative; }
  #view canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #preview { position: absolute; left: 8px; top: 8px; width: 72px; height: 72px; object-fit: contain; background: #fff; border-radius: 8px; border: 1px solid var(--line); }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button small { font-size: 12px; font-weight: 400; opacity: .85; }
  button { font: inherit; font-size: 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 14px 12px; flex: 1; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; }
  #status { margin: 12px 2px 0; font-size: 14px; color: var(--muted); min-height: 20px; }
  details { margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--card); }
  summary { font-weight: 600; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: 15px; }
  input[type=range] { flex: 1; }
  select, input[type=number] { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  #save h2 { font-size: 15px; margin: 18px 0 0; }
  #save small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>이미지 → 3D</h1>
  <p class="sub">사진 한 장으로 뒷면까지 추정해 3D 모델을 만들어요.</p>

  <div id="view"><img id="preview" hidden alt="입력 사진"></div>
  <input id="file" type="file" accept="image/*" hidden>

  <div class="row">
    <button id="pick">사진 고르기</button>
  </div>
  <div class="row">
    <button id="ai" class="primary" disabled>AI로 만들기<br><small>고품질 · 인터넷 필요</small></button>
    <button id="make" disabled>빠른 3D<br><small>휴대폰 안에서</small></button>
  </div>
  <div id="status">배경이 단순한 사진일수록 결과가 좋아요.</div>

  <details>
    <summary>설정</summary>
    <label style="display:block">Hugging Face 토큰 <small>(선택 · AI 무료 사용량 늘리기)</small>
      <input id="hftoken" type="password" placeholder="hf_로 시작하는 토큰" autocomplete="off" style="width:100%;margin-top:6px;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)">
    </label>
    <p style="margin:6px 0 0;font-size:13px;color:var(--muted)">토큰 없이도 하루 1~2번은 돼요. huggingface.co 무료 가입 → Settings → Access Tokens 에서 만들 수 있어요.</p>
    <p style="margin:12px 0 0;font-size:13px;color:var(--muted)">아래는 '빠른 3D' 설정이에요.</p>
    <label>두께 <input id="thick" type="range" min="0.1" max="1" step="0.05" value="0.5"><span id="thickv">0.50</span></label>
    <label>품질
      <select id="quality">
        <option value="96">빠름</option>
        <option value="128" selected>보통</option>
        <option value="176">세밀 (느림)</option>
      </select>
    </label>
    <label>배경 자동 제거 <input id="removebg" type="checkbox" checked></label>
    <label>STL 크기 (가장 긴 변, mm) <input id="sizemm" type="number" value="100" min="5" max="1000" style="width:90px"></label>
  </details>

  <div id="rigbox" hidden>
    <h2 style="font-size:15px;margin:18px 0 0">관절 <small style="color:var(--muted)">(서 있는 캐릭터용)</small></h2>
    <div class="row"><button id="rig">뼈대(관절) 넣기</button></div>
    <div id="rigctl" hidden>
      <label>관절 <select id="joint"></select></label>
      <label>앞뒤로 <input id="rx" type="range" min="-120" max="120" value="0"></label>
      <label>비틀기 <input id="ry" type="range" min="-120" max="120" value="0"></label>
      <label>옆으로 <input id="rz" type="range" min="-120" max="120" value="0"></label>
      <div class="row">
        <button data-pose="reset">처음 자세</button>
        <button data-pose="armsdown">팔 내리기</button>
        <button data-pose="wave">손 흔들기</button>
        <button data-pose="walk">걷기</button>
      </div>
      <p style="margin:8px 0 0;font-size:13px;color:var(--muted)">GLB로 저장하면 뼈대가 함께 들어가서 블렌더·게임엔진에서 바로 움직일 수 있어요. STL·OBJ는 지금 자세 그대로 저장돼요.</p>
    </div>
  </div>

  <div id="save" hidden>
    <h2>파일로 저장 <small>(다운로드/ImageTo3D 폴더)</small></h2>
    <div class="row">
      <button data-fmt="glb">GLB<br><small>색상·뼈대 포함</small></button>
      <button data-fmt="stl">STL<br><small>3D 프린팅·색 없음</small></button>
      <button data-fmt="obj">OBJ<br><small>편집용·색상 포함</small></button>
    </div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
